# FIN-SDO-1 INTEGRATED CANDIDATE — NATIVE CI-ONLY ROUTE (REVIEW-ONLY CONFIG until independently reviewed and merged to main).
# Manual, one pinned candidate (see .github/acceptance/fin-sdo-1-integrated/candidate.env), test-only PostgreSQL 16 service container.
# NO secrets, NO deployment, NO LIVE/production database, NO numbered FIN migration, NO migration-number allocation.
# Chain under test: numbered migrations 001-037 (product main fc98aae) + the UNNUMBERED FIN SQL loaded by the native scripts.
# A green run is a TECHNICAL gate only. It does NOT establish FIN1-25, acceptance, merge readiness or LIVE readiness.
# Dispatch needs a separate owner decision for this exact candidate; this file being on main does not grant it.
name: FIN-SDO-1 integrated native (CI-only, exact candidate)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly APPROVE-FIN-INTEGRATED-NATIVE-C867DC0D'
        required: true
        type: string
        default: DO_NOT_RUN

permissions: {}

concurrency:
  group: fin-sdo-1-integrated-native
  cancel-in-progress: false

jobs:
  native:
    if: >-
      github.repository == 'Shamil9586/construction-core-mvp' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Shamil9586' &&
      github.triggering_actor == 'Shamil9586' &&
      github.run_attempt == 1 &&
      inputs.confirmation == 'APPROVE-FIN-INTEGRATED-NATIVE-C867DC0D'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fin-test-only
          POSTGRES_DB: fin_sdo_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fin_sdo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      TZ: UTC
      DATABASE_URL: postgres://postgres:fin-test-only@127.0.0.1:5432/fin_sdo_test
      FIN_SDO_ISOLATED_CONFIRM: 'YES'
    steps:
      - name: Checkout reviewed harness from main (not candidate code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout immutable FIN candidate, full history, no credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c867dc0de12f4f3fbe544c1172a95b5e6176d4cb
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Pin SHA, tree, parents, clean checkout and migration inventory BEFORE any candidate code runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-raw
          source harness/.github/acceptance/fin-sdo-1-integrated/candidate.env
          # The YAML ref and candidate.env are two independent pins of the same SHA; verify-identity.sh requires them to agree.
          harness/.github/acceptance/fin-sdo-1-integrated/verify-identity.sh core evidence-raw 2>&1 | tee evidence-raw/identity.stdout.log

      - name: Pin Node.js 22.22.0 (no dependency cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'

      - name: Install candidate dependencies with full raw log and exit code
        shell: bash
        run: |
          set +e
          (cd core && npm ci --no-audit --no-fund) > evidence-raw/npm-ci.stdout.log 2> evidence-raw/npm-ci.stderr.log
          rc=$?; echo "$rc" > evidence-raw/npm-ci.exit; exit "$rc"

      - name: Checks on disposable PostgreSQL 16 (typecheck, build, unit, 001-037, native FIN suites over real HTTP, reviewer probe)
        shell: bash
        run: harness/.github/acceptance/fin-sdo-1-integrated/run-checks.sh core harness evidence-raw

      - name: Capture PostgreSQL logs, tear the service down and seal evidence even after errors
        if: always()
        shell: bash
        run: |
          # Discovery/log failures must never prevent teardown or sealing.
          set +e
          mkdir -p evidence-raw || exit 90
          status=0
          docker ps --format '{{.ID}} {{.Image}}' > evidence-raw/docker-ps.stdout.log 2> evidence-raw/docker-ps.stderr.log
          discovery_rc=$?
          printf 'docker_discovery_exit=%s\n' "$discovery_rc" > evidence-raw/teardown.txt
          cid=''
          if [[ "$discovery_rc" -eq 0 ]]; then cid="$(awk '$2 ~ /^postgres:16/ {print $1; exit}' evidence-raw/docker-ps.stdout.log)"; else status=1; fi
          if [[ -n "$cid" ]]; then
            docker logs "$cid" > evidence-raw/postgres-container.stdout.log 2> evidence-raw/postgres-container.stderr.log
            logs_rc=$?; printf 'docker_logs_exit=%s\n' "$logs_rc" >> evidence-raw/teardown.txt; [[ "$logs_rc" -ne 0 ]] && status=1
            docker stop "$cid" > evidence-raw/postgres-stop.stdout.log 2> evidence-raw/postgres-stop.stderr.log
            stop_rc=$?; printf 'docker_stop_exit=%s\n' "$stop_rc" >> evidence-raw/teardown.txt; [[ "$stop_rc" -ne 0 ]] && status=1
          else
            printf 'postgres_container=NOT_FOUND\ndocker_logs_exit=NOT_RUN\ndocker_stop_exit=NOT_RUN\n' >> evidence-raw/teardown.txt; status=1
          fi
          source harness/.github/acceptance/fin-sdo-1-integrated/candidate.env 2>/dev/null
          {
            printf 'runner_os=%s\n' "${{ runner.os }}"
            printf 'run_id=%s\n' "${{ github.run_id }}"
            printf 'run_attempt=%s\n' "${{ github.run_attempt }}"
            printf 'candidate=%s\n' "${CANDIDATE_SHA:-UNKNOWN}"
            printf 'workflow_sha=%s\n' "${{ github.sha }}"
            printf 'actor=%s triggering_actor=%s\n' "${{ github.actor }}" "${{ github.triggering_actor }}"
          } > evidence-raw/run-identity.txt || status=1
          harness/.github/acceptance/fin-sdo-1-integrated/seal.sh evidence-raw || status=1
          exit "$status"

      - name: Upload raw logs, exit codes and SHA-256 manifest, even on FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fin-sdo-1-integrated-native-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: evidence-raw/
          if-no-files-found: error
          retention-days: 30
