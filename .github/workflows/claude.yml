name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Additional shell grants are restricted to the owner-triggered S2 task on PR #17.
          # Every Bash rule is an exact command match; no wildcard or arbitrary suffix arguments.
          # npm ci must suppress dependency lifecycle scripts.
          claude_args: >-
            ${{ (github.event.issue.number == 17 || github.event.pull_request.number == 17) && github.actor == 'Shamil9586' && '--allowedTools "Bash(npm ci --ignore-scripts)" "Bash(npm run build)" "Bash(npm run typecheck:strict)" "Bash(node --import tsx --test tests/areaScopeTree.test.ts)" "Bash(npx --no-install playwright install chromium)" "Bash(npx --no-install playwright test --config playwright.gpr2-r05-area-scope.config.ts)"' || '' }}
