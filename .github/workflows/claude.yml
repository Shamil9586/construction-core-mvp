name: Claude Code (read-only)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-readonly:
    # Owner-only PR review; Issue implementation is a separate future workflow.
    if: >-
      github.event.comment.user.login == 'Shamil9586' &&
      github.event.comment.user.id == 329431095 &&
      contains(github.event.comment.body, '@claude') &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         github.event.issue.state == 'open') ||
        (github.event_name == 'pull_request_review_comment' &&
         github.event.pull_request.state == 'open')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code (read-only)
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          # PR-write covers PR conversation and inline comments; no Issues grant.
          # The explicit job-scoped token avoids the default App OIDC exchange.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: Shamil9586
          claude_args: |
            --max-turns 10
            --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,NotebookEditCell"
            --append-system-prompt "READ-ONLY REVIEW MODE. Analyze and reply only. Never modify files, create commits or branches, push, create PRs, merge, deploy, run migrations, or access credentials."
