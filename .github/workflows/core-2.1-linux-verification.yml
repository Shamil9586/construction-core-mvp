name: Core 2.1 Linux verification

on:
  push:
    branches:
      - verification/core-2.1-linux-01092d1
    paths:
      - .github/workflows/core-2.1-linux-verification.yml

permissions:
  contents: read

concurrency:
  group: core-2.1-linux-01092d1
  cancel-in-progress: false

jobs:
  browser-gate:
    name: Exact 01092d1 / Ubuntu / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: construction_ci
          POSTGRES_USER: construction
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction -d construction_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CANDIDATE_SHA: 01092d1d800d94c2fdd8bfcb9ba8bedcbfc92c75
      DATABASE_URL: postgres://construction:ci-only-password@127.0.0.1:5432/construction_ci
      DB_MODE: postgres
      NODE_ENV: test
      AUTH_MODE: mock
      MOCK_LOGIN_KEY: github-ci-local-only-01092d1
      PORT: "3001"
      BIND_HOST: 127.0.0.1
      APP_ORIGIN: http://localhost:5173
      TZ: UTC
      CI: "true"

    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v4
        with:
          ref: 01092d1d800d94c2fdd8bfcb9ba8bedcbfc92c75
          fetch-depth: 1

      - name: Verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          test -z "${E2E_BASE_URL:-}"
          test -z "${BROWSER_BASE_URL:-}"
          test -z "${PWDEBUG:-}"
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          mkdir -p "$EVIDENCE_DIR"
          printf 'expected=%s\nactual=%s\n' "$CANDIDATE_SHA" "$ACTUAL" | tee "$EVIDENCE_DIR/git-identity.txt"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Record environment versions and frontend cache state
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          {
            echo "OS:"
            uname -a
            echo
            echo "Node:"
            node --version
            echo "npm:"
            npm --version
            echo "Playwright:"
            npx playwright --version
            echo "Chromium:"
            CHROMIUM_PATH="$(node -e "const { chromium }=require('@playwright/test'); process.stdout.write(chromium.executablePath())")"
            "$CHROMIUM_PATH" --version
            echo
            if [ -d node_modules/.vite ]; then
              echo "VITE_CACHE=EXISTS_BEFORE_RUN"
              find node_modules/.vite -maxdepth 2 -type f -printf '%p %s %TY-%Tm-%TdT%TH:%TM:%TSZ\n' | sort
            else
              echo "VITE_CACHE=ABSENT_BEFORE_RUN"
            fi
          } | tee "$EVIDENCE_DIR/environment.txt"

      - name: Verify fresh PostgreSQL UTF8
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          node <<'NODE' | tee "$EVIDENCE_DIR/db-before.txt"
          const { Client } = require('pg');
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            const r = await c.query("select current_database() as database, current_setting('server_encoding') as encoding, inet_server_port() as port");
            console.log(JSON.stringify(r.rows[0]));
            if (r.rows[0].database !== 'construction_ci') throw new Error('Unexpected database');
            if (r.rows[0].encoding !== 'UTF8') throw new Error('PostgreSQL is not UTF8');
            if (Number(r.rows[0].port) !== 5432) throw new Error('Unexpected PostgreSQL port');
            await c.end();
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed disposable demo data
        run: npm run db:seed

      - name: Verify seeded database
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          node <<'NODE' | tee "$EVIDENCE_DIR/db-after-seed.txt"
          const { Client } = require('pg');
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            const r = await c.query("select (select count(*)::int from objects) as objects, (select count(*)::int from contractors) as contractors, (select count(*)::int from users where role='PROJECT_MANAGER') as project_managers");
            console.log(JSON.stringify(r.rows[0]));
            if (r.rows[0].objects !== 10) throw new Error('Seed object count mismatch');
            if (r.rows[0].contractors !== 8) throw new Error('Seed contractor count mismatch');
            if (r.rows[0].project_managers !== 5) throw new Error('Seed PM count mismatch');
            await c.end();
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Run the one authorized full Playwright suite
        id: browser
        shell: bash
        env:
          DEBUG: pw:webserver
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/core-2.1-ci-evidence/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ runner.temp }}/core-2.1-ci-evidence/results.xml
        run: |
          set -uo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          PW_OUTPUT_DIR="$RUNNER_TEMP/core-2.1-playwright-results"
          mkdir -p "$EVIDENCE_DIR" "$PW_OUTPUT_DIR"
          printf '%s\n' 'npx playwright test --workers=1 --retries=0 --trace=on --reporter=list,html,junit --output=<RUNNER_TEMP>/core-2.1-playwright-results' > "$EVIDENCE_DIR/exact-command.txt"
          START="$(date +%s)"
          set +e
          npx playwright test --workers=1 --retries=0 --trace=on --reporter=list,html,junit --output="$PW_OUTPUT_DIR" 2>&1 | tee "$EVIDENCE_DIR/playwright-console.log"
          PW_EXIT="${PIPESTATUS[0]}"
          set -e
          END="$(date +%s)"
          printf '%s\n' "$PW_EXIT" > "$EVIDENCE_DIR/playwright-exit-code.txt"
          printf '%s\n' "$((END-START))" > "$EVIDENCE_DIR/playwright-duration-seconds.txt"
          echo "exit_code=$PW_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Parse test counts
        id: counts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, xml.etree.ElementTree as ET
          evidence = os.path.join(os.environ['RUNNER_TEMP'], 'core-2.1-ci-evidence')
          os.makedirs(evidence, exist_ok=True)
          path = os.path.join(evidence, 'results.xml')
          out = os.environ['GITHUB_OUTPUT']
          summary = os.path.join(evidence, 'test-counts.txt')
          if not os.path.exists(path):
              values = dict(tests='UNKNOWN', failures='UNKNOWN', errors='UNKNOWN', skipped='UNKNOWN')
          else:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              def total(name):
                  return sum(int(s.attrib.get(name, '0')) for s in suites)
              values = dict(tests=str(total('tests')), failures=str(total('failures')), errors=str(total('errors')), skipped=str(total('skipped')))
          with open(summary, 'w', encoding='utf-8') as f:
              for k,v in values.items():
                  f.write(f'{k}={v}\n')
          with open(out, 'a', encoding='utf-8') as f:
              for k,v in values.items():
                  f.write(f'{k}={v}\n')
          print(values)
          PY

      - name: Parse trace network evidence for HTTP 429
        id: network
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import glob, json, os, zipfile
          evidence = os.path.join(os.environ['RUNNER_TEMP'], 'core-2.1-ci-evidence')
          results = os.path.join(os.environ['RUNNER_TEMP'], 'core-2.1-playwright-results')
          os.makedirs(evidence, exist_ok=True)
          traces = sorted(glob.glob(os.path.join(results, '**', 'trace.zip'), recursive=True))
          records = 0
          http429 = []
          parse_errors = []
          for trace in traces:
              try:
                  with zipfile.ZipFile(trace) as z:
                      members = [n for n in z.namelist() if n.endswith('.network')]
                      if not members:
                          parse_errors.append(f'{os.path.basename(os.path.dirname(trace))}: no .network member')
                          continue
                      for member in members:
                          for lineno, raw in enumerate(z.read(member).decode('utf-8', errors='replace').splitlines(), 1):
                              if not raw.strip():
                                  continue
                              try:
                                  obj = json.loads(raw)
                              except Exception:
                                  parse_errors.append(f'{os.path.basename(os.path.dirname(trace))}:{member}:{lineno}: json parse error')
                                  continue
                              if obj.get('type') != 'resource-snapshot':
                                  continue
                              snap = obj.get('snapshot') or {}
                              response = snap.get('response')
                              if not isinstance(response, dict):
                                  continue
                              records += 1
                              if response.get('status') == 429:
                                  req = snap.get('request') or {}
                                  url = req.get('url') or ''
                                  try:
                                      from urllib.parse import urlsplit
                                      path = urlsplit(url).path
                                  except Exception:
                                      path = '[unparsed]'
                                  http429.append({'test_dir': os.path.basename(os.path.dirname(trace)), 'member': member, 'line': lineno, 'method': req.get('method'), 'path': path})
              except Exception as e:
                  parse_errors.append(f'{os.path.basename(os.path.dirname(trace))}: {type(e).__name__}')
          if not traces or parse_errors:
              verdict = 'UNKNOWN'
          elif http429:
              verdict = 'YES'
          else:
              verdict = 'NO'
          out_path = os.path.join(evidence, 'network-429-evidence.txt')
          with open(out_path, 'w', encoding='utf-8') as f:
              f.write(f'trace_archives={len(traces)}\n')
              f.write(f'network_response_records={records}\n')
              f.write(f'parse_errors={len(parse_errors)}\n')
              f.write(f'http_429_count={len(http429)}\n')
              f.write(f'429={verdict}\n')
              for item in http429:
                  f.write(json.dumps(item, ensure_ascii=False) + '\n')
              for err in parse_errors:
                  f.write('ERROR ' + err + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'verdict={verdict}\n')
              f.write(f'traces={len(traces)}\n')
              f.write(f'count429={len(http429)}\n')
          print(f'traces={len(traces)} 429={verdict} count={len(http429)} parse_errors={len(parse_errors)}')
          PY

      - name: Record final repository state
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "status:"
            git status --porcelain
            echo "diff-check:"
            git diff --check
          } | tee "$EVIDENCE_DIR/git-final.txt"

      - name: Decide independent Linux browser gate
        if: always()
        shell: bash
        env:
          PW_EXIT: ${{ steps.browser.outputs.exit_code }}
          TESTS: ${{ steps.counts.outputs.tests }}
          FAILURES: ${{ steps.counts.outputs.failures }}
          ERRORS: ${{ steps.counts.outputs.errors }}
          SKIPPED: ${{ steps.counts.outputs.skipped }}
          NETWORK_429: ${{ steps.network.outputs.verdict }}
          TRACE_COUNT: ${{ steps.network.outputs.traces }}
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/core-2.1-ci-evidence"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "candidate=$CANDIDATE_SHA"
            echo "playwright_exit=${PW_EXIT:-UNKNOWN}"
            echo "tests=${TESTS:-UNKNOWN}"
            echo "failures=${FAILURES:-UNKNOWN}"
            echo "errors=${ERRORS:-UNKNOWN}"
            echo "skipped=${SKIPPED:-UNKNOWN}"
            echo "trace_archives=${TRACE_COUNT:-UNKNOWN}"
            echo "429=${NETWORK_429:-UNKNOWN}"
          } | tee "$EVIDENCE_DIR/final-verdict.txt"

          test "${PW_EXIT:-UNKNOWN}" = "0"
          test "${TESTS:-UNKNOWN}" = "5"
          test "${FAILURES:-UNKNOWN}" = "0"
          test "${ERRORS:-UNKNOWN}" = "0"
          test "${SKIPPED:-UNKNOWN}" = "0"
          test "${TRACE_COUNT:-UNKNOWN}" = "5"
          test "${NETWORK_429:-UNKNOWN}" = "NO"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

          echo "INDEPENDENT LINUX FULL PLAYWRIGHT PASS" | tee -a "$EVIDENCE_DIR/final-verdict.txt"

      - name: Upload Linux verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-2.1-linux-01092d1-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/core-2.1-ci-evidence/
            ${{ runner.temp }}/core-2.1-playwright-results/
