name: CR01 API Startup Safety

on:
  push:
    branches:
      - fix/cr01-api-startup-no-auto-migrations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cr01-api-startup-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and build (isolated, no LIVE credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deliberately do not map repository secrets or production connection strings.
      # This job must never connect to LIVE PostgreSQL or deploy any service.
      NODE_ENV: test
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository test suite
        run: npm test

      - name: Build application
        run: npm run build
